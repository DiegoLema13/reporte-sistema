<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario Técnico</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="contenedor">

  <img
        src="{{ url_for('static', filename='logo.png') }}"
        alt="Logo"
        class="logo">

    <h2>Formulario Técnico</h2>

    


    <form action="/enviar" method="post">

        <!-- TECNICO -->
        <label>Técnico</label>

        <select
    name="nombre"
    id="tecnico"
    required>

            <option value="">Seleccione...</option>

            <option value="Diego Lema">
                Diego Lema
            </option>

            <option value="Juan Perez">
                Juan Perez
            </option>

        </select>

        <label>Cédula</label>

<input
    type="text"
    name="cedula"
    id="cedula"
    readonly>


        <!-- PROVINCIA -->
        <label>Provincia</label>

        <select id="provincia" required>

            <option value="">
                Seleccione...
            </option>

            <option value="Pichincha">
                Pichincha
            </option>

            <option value="Guayas">
                Guayas
            </option>

        </select>


        <!-- AGENCIA -->
        <label>Agencia</label>

        <select
            name="provincia"
            id="agencia"
            required>

            <option value="">
                Seleccione una provincia primero
            </option>

        </select>

        <label>Delegada / Responsable</label>

<!-- DELEGDA -->
<input
    type="text"
    name="delegada"
    placeholder="Ingrese nombre de la delegada"
    required>


    <!-- MODELO -->
<label>Modelo</label>

<select
    name="modelo"
    required>

    <option value="">
        Seleccione...
    </option>

    <option value="TM-H6000V">
        TM-H6000V
    </option>

    <option value="TM-T20III">
        TM-T20III
    </option>

</select>



<!-- SERIES -->
<label>Series</label>

<div id="contenedor-series">

    <input
        type="text"
        name="series[]"
        placeholder="Ingrese serie"
        required>

</div>


<button
    type="button"
    id="agregar-serie">

    + Agregar Serie

</button>


        <!-- OBSERVACIONES -->
        <label>Observaciones</label>

        <textarea
            name="problema"
            placeholder="Ingrese observaciones técnicas..."
            required>
        </textarea>


        <button type="submit">
            Enviar Reporte
        </button>

    </form>

</div>


<script
    src="{{ url_for('static', filename='script.js') }}">
</script>

</body>
</html>
