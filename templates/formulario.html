<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario Técnico</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="contenedor">

    <h2>Formulario Técnico</h2>

    <img
        src="{{ url_for('static', filename='logo.png') }}"
        alt="Logo"
        class="logo">


    <form action="/enviar" method="post">

        <!-- TECNICO -->
        <label>Técnico</label>

        <select name="nombre" required>

            <option value="">Seleccione...</option>

            <option value="Diego Lema">
                Diego Lema
            </option>

            <option value="Juan Perez">
                Juan Perez
            </option>

        </select>


        <!-- PROVINCIA -->
        <label>Provincia</label>

        <select id="provincia" required>

            <option value="">
                Seleccione...
            </option>

            <option value="Pichincha">
                Pichincha
            </option>

            <option value="Guayas">
                Guayas
            </option>

        </select>


        <!-- AGENCIA -->
        <label>Agencia</label>

        <select
            name="provincia"
            id="agencia"
            required>

            <option value="">
                Seleccione una provincia primero
            </option>

        </select>


        <!-- OBSERVACIONES -->
        <label>Observaciones</label>

        <textarea
            name="problema"
            placeholder="Ingrese observaciones técnicas..."
            required>
        </textarea>


        <button type="submit">
            Enviar Reporte
        </button>

    </form>

</div>


<script>

    const agencias = {

        "Pichincha": [
            "Quito Norte",
            "Quito Sur",
            "Sangolquí",
            "Cayambe"
        ],

        "Guayas": [
            "Guayaquil Centro",
            "Durán",
            "Milagro"
        ]

    };

    const provinciaSelect =
        document.getElementById("provincia");

    const agenciaSelect =
        document.getElementById("agencia");


    provinciaSelect.addEventListener("change", function(){

        const provincia =
            this.value;

        agenciaSelect.innerHTML = "";

        const opcionInicial =
            document.createElement("option");

        opcionInicial.value = "";

        opcionInicial.textContent =
            "Seleccione una agencia";

        agenciaSelect.appendChild(opcionInicial);

        if(agencias[provincia]){

            agencias[provincia].forEach(function(agencia){

                const option =
                    document.createElement("option");

                option.value = agencia;

                option.textContent = agencia;

                agenciaSelect.appendChild(option);

            });

        }

    });

</script>

</body>
</html>
